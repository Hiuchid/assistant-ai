[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 92
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# RUF001-003 flag characters that could be confused with Latin ones -- a good
# rule for a homoglyph slipped into an identifier, and meaningless in a file
# whose entire content is deliberately Arabic. Scoped to that one file so the
# check keeps working everywhere it means something.
"backend/prompts/visitor_ar.py" = ["RUF001", "RUF002", "RUF003"]
"backend/repair.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

# pywebpush ships no type information and has no stubs package. This declares
# that fact about a dependency; it is not a line-level ignore hiding a real
# error, and it is scoped to the one module so nothing else loses checking.
[[tool.mypy.overrides]]
module = "pywebpush.*"
ignore_missing_imports = true
