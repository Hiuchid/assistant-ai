# Personal Assistant — nginx reverse proxy.
#
# Deviation from INSTRUCTIONS.md r3 §2, recorded deliberately: the plan
# specified Caddy, but this VPS already runs nginx on :80/:443 serving
# gardening-ai.duckdns.org. Installing Caddy would contend for those ports and
# taking nginx down would break a live app, so we follow the pattern already
# working on this box instead. See r4 §2.
#
# certbot rewrites this file to add the TLS listener and the :80 -> :443
# redirect, exactly as it did for gardening-ai. Install it HTTP-only first.

server {
    listen 80;
    listen [::]:80;
    server_name assistant-ai.duckdns.org;

    # Keep request bodies small: this endpoint takes utterance-sized audio
    # clips, not uploads. Groq's own cap is 25 MB; we have no reason to be
    # anywhere near it.
    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket upgrade. nginx does NOT do this by default — without these
        # two headers the Phase 1 handshake fails with a 400. Caddy does it
        # automatically, which is why the original plan never mentioned it.
        # $connection_upgrade comes from conf.d/websocket_upgrade.conf.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A voice session is idle whenever nobody is speaking. nginx's default
        # 60s read timeout would drop the socket mid-conversation during any
        # natural pause.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Stream LLM tokens and audio chunks straight through. With buffering
        # on, nginx accumulates the response and destroys the first-token
        # latency the whole design in §7 exists to protect.
        proxy_buffering off;
    }
}
