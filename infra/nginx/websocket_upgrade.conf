# Maps the Upgrade request header to the correct Connection response header.
#
# This must live in the http{} context, which is why it is a separate file in
# conf.d/ rather than part of the server block. Without it, $connection_upgrade
# is undefined and nginx refuses to start.
#
# Shared, but harmless to the existing gardening-ai server block: that block
# never references $connection_upgrade, so its behaviour is unchanged.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
