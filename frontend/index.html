<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistant — Health</title>
<style>
  :root { color-scheme: light dark; --ok:#137a4b; --bad:#b3261e; --fg:#1a1a1a; --bg:#fafaf8; --mut:#666; --line:#e0e0dc; }
  @media (prefers-color-scheme: dark) {
    :root { --ok:#4ade80; --bad:#f87171; --fg:#e8e8e6; --bg:#141416; --mut:#999; --line:#2a2a2e; }
  }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
         font:15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { width:min(90vw,440px); border:1px solid var(--line); border-radius:12px; padding:24px; }
  h1 { margin:0 0 4px; font-size:17px; font-weight:600; }
  .sub { color:var(--mut); font-size:13px; margin-bottom:20px; }
  .row { display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--mut); flex:none; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .k { color:var(--mut); font-size:13px; min-width:96px; }
  .v { font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-size:13px; word-break:break-all; }
  pre { margin:12px 0 0; padding:10px; background:color-mix(in srgb, var(--fg) 5%, transparent);
        border-radius:6px; font-size:12px; overflow-x:auto; color:var(--bad); white-space:pre-wrap; }
</style>
</head>
<body>
  <div class="card">
    <h1>Personal Assistant</h1>
    <div class="sub">Phase 0 — backend connectivity check</div>
    <div class="row"><span class="dot" id="dot"></span><span class="k">status</span><span class="v" id="status">checking…</span></div>
    <div class="row"><span class="dot"></span><span class="k">version</span><span class="v" id="version">—</span></div>
    <div class="row"><span class="dot"></span><span class="k">env</span><span class="v" id="env">—</span></div>
    <div class="row"><span class="dot"></span><span class="k">your ip</span><span class="v" id="ip">—</span></div>
    <pre id="err" hidden></pre>
  </div>

<script type="module">
// Phase 0 verifies three things at once: HTTPS reaches the backend, CORS is
// configured for this exact origin, and nginx forwards the real client IP.
// If `your ip` shows 127.0.0.1, proxy headers are misconfigured (§4.2).
const API = "https://assistant-ai.duckdns.org";

const $ = (id) => document.getElementById(id);

try {
  const res = await fetch(`${API}/health`, { mode: "cors" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();

  $("dot").className = "dot ok";
  $("status").textContent = data.status;
  $("version").textContent = data.version;
  $("env").textContent = data.env;
  $("ip").textContent = data.client_ip ?? "unknown";
} catch (e) {
  $("dot").className = "dot bad";
  $("status").textContent = "unreachable";
  const err = $("err");
  err.hidden = false;
  err.textContent =
    `${e}\n\nIf this is a CORS error, add this page's origin\n(${location.origin})\nto ALLOWED_ORIGINS in the backend .env and restart.`;
}
</script>
</body>
</html>
