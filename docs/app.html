<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#131a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Assistant">
<link rel="stylesheet" href="css/shell.css">
</head>
<body>

<!-- Sign in. Replaces the shell entirely rather than sitting inside it: there
     is nothing to navigate between until there is a session. -->
<div class="login-view" id="loginView">
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>Assistant</h1>
    <p>Sign in to continue.</p>
    <label for="email">Email</label>
    <input type="email" id="email" required autocomplete="username">
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password">
    <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
    <div class="err" id="loginErr" role="alert"></div>
  </form>
</div>

<div class="shell" id="shell" hidden>
  <div class="appbar">
    <button class="iconbtn" id="refreshBtn" title="Refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <div class="title"><b>Assistant</b><span id="appSub">at your service</span></div>
    <button class="iconbtn" id="signOutBtn" title="Sign out" aria-label="Sign out">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>

  <div class="subbar">
    <h1 id="viewTitle"><span id="viewIcon"></span><span id="viewName">Today</span></h1>
    <span class="dot" id="dot" hidden></span>
    <span class="state" id="state" style="font-size:.75rem;color:var(--text-faint)"></span>
  </div>

  <div class="views" id="views">

    <!-- ---------- Today ---------- -->
    <section class="view active" id="view-today">
      <div class="greeting" id="greeting">Good day</div>
      <p class="greeting-sub" id="todayDate"></p>
      <div id="todayBody"></div>
      <div class="pillrow">
        <button class="pill" data-goto="talk">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Talk to the assistant
        </button>
        <button class="pill" data-goto="inbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 12h-6l-2 3h-4l-2-3H2"/>
            <path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          Open the inbox
        </button>
      </div>
    </section>

    <!-- ---------- Talk ---------- -->
    <section class="view flush" id="view-talk">
      <div class="log" id="log" role="log" aria-live="polite"></div>
    </section>

    <!-- ---------- Inbox ---------- -->
    <section class="view" id="view-inbox">
      <div class="pillrow" style="margin:0 0 var(--sp-4)">
        <button class="pill" data-filter="status" data-value="new" aria-pressed="true">New</button>
        <button class="pill" data-filter="status" data-value="" aria-pressed="false">All</button>
        <button class="pill" data-filter="mode" data-value="" aria-pressed="true">Both</button>
        <button class="pill" data-filter="mode" data-value="visitor" aria-pressed="false">Inbound</button>
        <button class="pill" data-filter="mode" data-value="owner" aria-pressed="false">Mine</button>
      </div>
      <div id="inboxBody"></div>
    </section>

    <!-- ---------- Reminders ---------- -->
    <section class="view" id="view-reminders">
      <div id="remindersBody"></div>
    </section>

    <!-- ---------- Settings ---------- -->
    <section class="view" id="view-settings">
      <div class="section-label">Notifications</div>
      <div id="pushBody"></div>
      <div class="section-label">Service</div>
      <div class="card static">
        <span class="chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round"><path d="M12 2v4M12 18v4M4.9 4.9l2.9 2.9M16.2 16.2l2.9 2.9M2 12h4M18 12h4M4.9 19.1l2.9-2.9M16.2 7.8l2.9-2.9"/></svg>
        </span>
        <div class="body"><b id="svcState">checking…</b><span id="svcDetail"></span></div>
      </div>
      <div class="section-label">Account</div>
      <div class="card static">
        <span class="chip-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </span>
        <div class="body"><b id="acctEmail">—</b><span>signed in</span></div>
      </div>
      <div class="pillrow">
        <button class="pill" id="settingsSignOut">Sign out</button>
      </div>
    </section>
  </div>

  <!-- Composer belongs to Talk only; hidden elsewhere so the tab bar sits flush. -->
  <form class="composer" id="form" autocomplete="off" hidden>
    <button type="button" class="iconbtn" id="mic" aria-pressed="false"
            title="Start a voice call" aria-label="Start a voice call">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    </button>
    <input type="text" id="input" placeholder="Type…" disabled
           aria-label="Message" maxlength="4000">
    <button type="button" class="iconbtn" id="mute" aria-pressed="false"
            title="Mute the voice">🔊</button>
    <button type="submit" class="send" id="send" disabled aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg>
    </button>
  </form>

  <nav class="tabs" id="tabs" role="tablist">
    <button class="tab" role="tab" data-view="today" aria-selected="true">
      <span class="puck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <small>Today</small>
    </button>
    <button class="tab" role="tab" data-view="talk" aria-selected="false">
      <span class="puck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
      <small>Talk</small>
    </button>
    <button class="tab" role="tab" data-view="inbox" aria-selected="false">
      <span class="puck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg></span>
      <small>Inbox</small><span class="badge" id="inboxBadge" hidden></span>
    </button>
    <button class="tab" role="tab" data-view="reminders" aria-selected="false">
      <span class="puck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M5 3 2 6M19 3l3 3"/></svg></span>
      <small>Reminders</small><span class="badge" id="dueBadge" hidden></span>
    </button>
    <button class="tab" role="tab" data-view="settings" aria-selected="false">
      <span class="puck"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
      <small>Settings</small>
    </button>
  </nav>
</div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
