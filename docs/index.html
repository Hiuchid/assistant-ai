<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leave a message</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#faf9f7; --panel:#ffffff; --fg:#1b1b1a; --mut:#6b6b68; --line:#e6e4df;
    --agent-bg:#f2f1ed; --user-bg:#1b1b1a; --user-fg:#faf9f7;
    --ok:#137a4b; --bad:#b3261e; --accent:#1b1b1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#131314; --panel:#1a1a1c; --fg:#e9e8e4; --mut:#98978f; --line:#2c2c2f;
      --agent-bg:#232326; --user-bg:#e9e8e4; --user-fg:#131314;
      --ok:#4ade80; --bad:#f87171; --accent:#e9e8e4;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100dvh; background:var(--bg); color:var(--fg);
    font:15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    display:grid; place-items:center; padding:16px;
  }
  .app {
    width:min(100%, 560px); height:min(88dvh, 680px); background:var(--panel);
    border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column;
    overflow:hidden;
  }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header h1 { margin:0; font-size:15px; font-weight:600; letter-spacing:-0.01em; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--mut); flex:none; transition:background .2s; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .state { font-size:12px; color:var(--mut); }
  .icon { background:none; border:0; padding:2px 6px; font-size:15px;
          cursor:pointer; line-height:1; opacity:.85; }
  #mic { margin-left:auto; }
  .icon:hover { opacity:1; }
  #mic.live { opacity:1; color:var(--bad); }
  #mic.hearing { animation:pulse .8s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
  .icon[aria-pressed="true"] { opacity:.4; }

  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:82%; padding:9px 13px; border-radius:14px; white-space:pre-wrap; word-wrap:break-word; }
  .msg.agent { background:var(--agent-bg); border-bottom-left-radius:5px; align-self:flex-start; }
  .msg.user  { background:var(--user-bg); color:var(--user-fg); border-bottom-right-radius:5px; align-self:flex-end; }
  .msg.error { background:transparent; color:var(--bad); border:1px solid var(--bad); align-self:stretch; max-width:100%; font-size:13px; }
  .meta { align-self:flex-start; font-size:11px; color:var(--mut); font-family:ui-monospace,Consolas,monospace; }

  .cursor::after {
    content:"▋"; margin-left:1px; opacity:.5; animation:blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:0; } }

  form { display:flex; gap:8px; padding:12px; border-top:1px solid var(--line); }
  input[type=text] {
    flex:1; padding:10px 13px; border-radius:9px; border:1px solid var(--line);
    background:var(--bg); color:var(--fg); font:inherit; min-width:0;
  }
  input[type=text]:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button {
    padding:10px 16px; border-radius:9px; border:0; background:var(--accent);
    color:var(--panel); font:inherit; font-weight:550; cursor:pointer;
  }
  button:disabled { opacity:.4; cursor:not-allowed; }
  @media (prefers-reduced-motion: reduce) { .cursor::after { animation:none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="dot" id="dot"></span>
    <h1>Leave a message</h1>
    <button type="button" id="mic" class="icon" aria-pressed="false"
            title="Talk instead of typing">🎤</button>
    <button type="button" id="mute" class="icon" aria-pressed="false"
            title="Mute the voice">🔊</button>
    <span class="state" id="state">connecting…</span>
  </header>
  <div id="log" role="log" aria-live="polite"></div>
  <form id="form" autocomplete="off">
    <input type="text" id="input" placeholder="Type your message…" disabled
           aria-label="Your message" maxlength="4000">
    <button type="submit" id="send" disabled>Send</button>
  </form>
</div>

<script type="module">
const WS_URL = "wss://assistant-ai.duckdns.org/ws/chat";

const $ = (id) => document.getElementById(id);
const log = $("log"), input = $("input"), send = $("send"), form = $("form");
const dot = $("dot"), state = $("state");

let socket = null;
let streaming = null;   // the agent bubble currently being written into
let retryDelay = 1000;

// ---- audio playback ----------------------------------------------------
// The server sends one complete audio file per sentence, in generation order.
// decodeAudioData handles MP3 (edge-tts, Fish) and WAV (Piper) alike, so there
// is a single decode path regardless of which backend synthesised it.
let audioCtx = null;
let decodeChain = Promise.resolve();  // keeps decodes in arrival order
const audioQueue = [];
let playing = false;
let muted = false;
let currentSource = null;   // the node actually sounding right now
let audioEpoch = 0;         // bumped on every interruption

function ensureAudio() {
  // Browsers block AudioContext until a user gesture; sending a message is one.
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}

function enqueueAudio(msg) {
  if (muted || !audioCtx) return;
  // Chained rather than parallel: decodeAudioData resolves out of order for
  // differently-sized clips, which would play the reply's sentences shuffled.
  const epoch = audioEpoch;
  decodeChain = decodeChain.then(async () => {
    if (epoch !== audioEpoch) return;          // superseded before we started
    try {
      const bytes = Uint8Array.from(atob(msg.data), (c) => c.charCodeAt(0));
      const buffer = await audioCtx.decodeAudioData(bytes.buffer);
      // Check again: the interruption may have landed during the decode, and
      // without this the cancelled reply resumes a moment later.
      if (epoch !== audioEpoch) return;
      audioQueue.push(buffer);
      if (!playing) playNext();
    } catch (e) {
      console.warn("could not decode audio", e);
    }
  });
}

function playNext() {
  const buffer = audioQueue.shift();
  if (!buffer) { playing = false; currentSource = null; return; }
  playing = true;
  const source = audioCtx.createBufferSource();
  source.buffer = buffer;
  source.connect(audioCtx.destination);
  // Guarded: a source we stopped deliberately also fires onended, and without
  // this check it would start the next sentence we just cancelled.
  source.onended = () => { if (currentSource === source) playNext(); };
  currentSource = source;
  source.start();
}

function stopAudio() {
  // Bumping the epoch voids decodes still in flight for the cancelled reply.
  audioEpoch++;
  audioQueue.length = 0;
  if (currentSource) {
    // Clearing the queue is not enough -- the sentence already sounding has to
    // be stopped, or the assistant talks over the person interrupting it.
    currentSource.onended = null;
    try { currentSource.stop(); } catch (e) { /* already ended */ }
    currentSource = null;
  }
  playing = false;
}

function setState(text, cls) {
  state.textContent = text;
  dot.className = "dot" + (cls ? " " + cls : "");
}

function bubble(cls, text = "") {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function setComposerEnabled(on) {
  input.disabled = !on;
  send.disabled = !on;
  if (on) input.focus();
}

function connect() {
  setState("connecting…");
  socket = new WebSocket(WS_URL);

  socket.onopen = () => {
    retryDelay = 1000;
    setState("connected", "ok");
    setComposerEnabled(true);
  };

  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === "ready") {
      // Nothing to show — the server is just handing us a conversation id.
      return;
    }
    if (msg.type === "interrupted") {
      // Server cancelled the reply because we started talking over it.
      stopAudio();
      if (streaming) streaming.classList.remove("cursor");
      streaming = null;
      setComposerEnabled(true);
      return;
    }
    if (msg.type === "transcript") {
      // Echoed back so a misrecognition is visible before it reaches a ticket.
      bubble("user", msg.text);
      return;
    }
    if (msg.type === "not_heard") {
      setState(listening ? "listening" : "connected", "ok");
      setComposerEnabled(true);
      return;
    }
    if (msg.type === "audio") {
      enqueueAudio(msg);
      return;
    }
    if (msg.type === "token") {
      if (!streaming) {
        streaming = bubble("agent");
        streaming.classList.add("cursor");
      }
      streaming.textContent += msg.text;
      log.scrollTop = log.scrollHeight;
      return;
    }
    if (msg.type === "done") {
      if (streaming) streaming.classList.remove("cursor");
      streaming = null;
      // Latency and model are surfaced deliberately: §7 says we cannot tune
      // what we cannot see, and this is the cheapest possible view of it.
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${msg.model} · first token ${msg.first_token_ms}ms · total ${msg.total_ms}ms`;
      log.appendChild(meta);
      log.scrollTop = log.scrollHeight;
      setComposerEnabled(true);
      return;
    }
    if (msg.type === "error") {
      if (streaming) streaming.classList.remove("cursor");
      streaming = null;
      bubble("error", msg.message);
      setComposerEnabled(true);
    }
  };

  socket.onclose = (event) => {
    setComposerEnabled(false);
    streaming = null;
    // 1008 is the server refusing us on policy — a disallowed Origin, too many
    // connections, or at capacity. Reconnecting would just be refused again.
    if (event.code === 1008) {
      setState("refused", "bad");
      bubble("error", `Connection refused: ${event.reason || "policy"}`);
      return;
    }
    setState("reconnecting…", "bad");
    setTimeout(connect, retryDelay);
    retryDelay = Math.min(retryDelay * 2, 15000);
  };

  socket.onerror = () => setState("connection error", "bad");
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || !socket || socket.readyState !== WebSocket.OPEN) return;
  ensureAudio();          // this submit is the user gesture audio needs
  stopAudio();            // a new question cancels whatever is still speaking
  bubble("user", text);
  socket.send(JSON.stringify({ type: "user_message", text }));
  input.value = "";
  setComposerEnabled(false);
});

const mute = $("mute");
mute.addEventListener("click", () => {
  muted = !muted;
  mute.textContent = muted ? "🔇" : "🔊";
  mute.setAttribute("aria-pressed", String(muted));
  mute.title = muted ? "Unmute the voice" : "Mute the voice";
  if (muted) stopAudio();
});

// ---- voice input -------------------------------------------------------
// Energy-based endpointing rather than a neural VAD. @ricky0123/vad-web needs
// onnxruntime's wasm, measured at 13.3 MB raw / 4.75 MB gzipped -- four times
// the budget §3.2 allows for a widget that must load on mobile data. An
// AnalyserNode costs nothing and is adequate in a normal room; if it proves
// flaky in noise, Silero can be lazy-loaded on first mic use.
let listening = false;
let micStream = null;
let recorder = null;
let analyser = null;
let chunks = [];
let speaking = false;          // caller is currently talking
let silenceSince = 0;
let noiseFloor = 0.01;
let pollTimer = null;

const SILENCE_HANGOVER_MS = 900;   // quiet this long ends the utterance
const MIN_UTTERANCE_MS = 400;      // shorter than this is a cough, not speech
const SPEECH_MARGIN = 2.5;         // times the measured noise floor
// Onset must sustain across a few polls. Without this, a single loud frame
// starts a turn -- and on speakers, the assistant's own voice leaking past
// echo cancellation would make it interrupt itself.
const SPEECH_ONSET_FRAMES = 3;     // x 50ms poll = ~150ms sustained
let speechStartedAt = 0;
let loudFrames = 0;

function rms() {
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  let sum = 0;
  for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  return Math.sqrt(sum / buf.length);
}

async function startListening() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
  });
  ensureAudio();
  const source = audioCtx.createMediaStreamSource(micStream);
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 1024;
  source.connect(analyser);

  // Calibrate against the actual room rather than a guessed constant.
  const samples = [];
  for (let i = 0; i < 12; i++) {
    samples.push(rms());
    await new Promise((r) => setTimeout(r, 40));
  }
  noiseFloor = Math.max(0.005, samples.sort()[Math.floor(samples.length / 2)]);

  listening = true;
  micBtn.classList.add("live");
  micBtn.setAttribute("aria-pressed", "true");
  setState("listening", "ok");
  pollTimer = setInterval(poll, 50);
}

function stopListening() {
  listening = false;
  clearInterval(pollTimer);
  if (recorder && recorder.state === "recording") recorder.stop();
  if (micStream) micStream.getTracks().forEach((t) => t.stop());
  micStream = null; recorder = null; analyser = null; speaking = false;
  micBtn.classList.remove("live", "hearing");
  micBtn.setAttribute("aria-pressed", "false");
  setState("connected", "ok");
}

function poll() {
  if (!analyser) return;
  const level = rms();
  const loud = level > noiseFloor * SPEECH_MARGIN;
  loudFrames = loud ? loudFrames + 1 : 0;

  if (loudFrames >= SPEECH_ONSET_FRAMES && !speaking) {
    speaking = true;
    speechStartedAt = Date.now();
    micBtn.classList.add("hearing");
    // Barge-in (§7.4): kill playback immediately, and tell the server before
    // the audio upload so it can cancel the LLM and TTS work in flight.
    if (playing || audioQueue.length) {
      stopAudio();
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ type: "barge_in" }));
      }
    }
    chunks = [];
    recorder = new MediaRecorder(micStream, { mimeType: "audio/webm;codecs=opus" });
    recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = sendUtterance;
    recorder.start();
    silenceSince = 0;
  } else if (!loud && speaking) {
    if (!silenceSince) silenceSince = Date.now();
    if (Date.now() - silenceSince > SILENCE_HANGOVER_MS) {
      speaking = false;
      micBtn.classList.remove("hearing");
      const spoken = Date.now() - speechStartedAt - SILENCE_HANGOVER_MS;
      if (recorder && recorder.state === "recording") {
        recorder.stop();
        if (spoken < MIN_UTTERANCE_MS) chunks = [];   // too short to be speech
      }
    }
  } else if (loud && speaking) {
    silenceSince = 0;
  }
}

async function sendUtterance() {
  if (!chunks.length) return;
  const blob = new Blob(chunks, { type: "audio/webm" });
  chunks = [];
  // Groq bills a 10-second minimum per request, so a fragment costs the same
  // as a sentence. Drop the ones that are obviously not speech.
  if (blob.size < 2000) return;
  const b64 = await new Promise((resolve) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result.split(",")[1]);
    fr.readAsDataURL(blob);
  });
  if (socket && socket.readyState === WebSocket.OPEN) {
    setState("transcribing…", "ok");
    socket.send(JSON.stringify({ type: "audio", data: b64, mime: "audio/webm" }));
  }
}

const micBtn = $("mic");
micBtn.addEventListener("click", async () => {
  try {
    if (listening) stopListening();
    else await startListening();
  } catch (e) {
    bubble("error", "Could not access the microphone: " + e.message);
    stopListening();
  }
});


connect();
</script>
</body>
</html>
